{% extends "base.html" %}

{% block title %}Contact Us - QRNation{% endblock %}

{% block content %}
<section class="premium-section">
    <div class="section-badge">Company</div>
    <h1 class="hero-title">Get in <span class="gradient-text">Touch</span></h1>
    <p class="hero-subtitle">Have questions or want to partner with us? We'd love to hear from you.</p>

    <div class="contact-grid"
        style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 60px; margin-top: 60px; max-width: 1000px; margin-left: auto; margin-right: auto;">
        <div>
            <h2>Contact Information</h2>
            <div style="margin-top: 30px;">
                <div style="display: flex; align-items: center; margin-bottom: 25px;">
                    <div
                        style="background: var(--bg-secondary); padding: 12px; border-radius: 10px; margin-right: 20px;">
                        <i data-lucide="mail" style="color: var(--accent-primary);"></i>
                    </div>
                    <div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Email</div>
                        <div style="font-weight: 500;">i.m.ashishhh@gmail.com</div>
                    </div>
                </div>
                <div style="display: flex; align-items: center; margin-bottom: 25px;">
                    <div
                        style="background: var(--bg-secondary); padding: 12px; border-radius: 10px; margin-right: 20px;">
                        <i data-lucide="map-pin" style="color: var(--accent-primary);"></i>
                    </div>
                    <div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Office</div>
                        <div style="font-weight: 500;">Mumbai, Maharashtra, India</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="contact-form-container"
            style="background: var(--bg-secondary); padding: 40px; border-radius: 20px; border: 1px solid var(--bg-tertiary);">
            <form action="#" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div>
                        <label
                            style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary);">First
                            Name</label>
                        <input type="text" placeholder="Jane"
                            style="width: 100%; padding: 12px; background: var(--bg-primary); border: 1px solid var(--bg-tertiary); border-radius: 8px; color: var(--text-primary);">
                    </div>
                    <div>
                        <label
                            style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary);">Last
                            Name</label>
                        <input type="text" placeholder="Doe"
                            style="width: 100%; padding: 12px; background: var(--bg-primary); border: 1px solid var(--bg-tertiary); border-radius: 8px; color: var(--text-primary);">
                    </div>
                </div>
                <div style="margin-bottom: 20px;">
                    <label
                        style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary);">Email
                        Address</label>
                    <input type="email" placeholder="jane@example.com"
                        style="width: 100%; padding: 12px; background: var(--bg-primary); border: 1px solid var(--bg-tertiary); border-radius: 8px; color: var(--text-primary);">
                </div>
                <div style="margin-bottom: 30px;">
                    <label
                        style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary);">Message</label>
                    <textarea placeholder="How can we help you?"
                        style="width: 100%; padding: 12px; background: var(--bg-primary); border: 1px solid var(--bg-tertiary); border-radius: 8px; color: var(--text-primary); min-height: 120px;"></textarea>
                </div>
                <button type="button" class="btn btn-primary" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
