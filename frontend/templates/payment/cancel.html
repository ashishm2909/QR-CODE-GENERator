{% extends "base.html" %}

{% block title %}Payment Cancelled - QRNation{% endblock %}

{% block content %}
<div class="payment-page" style="text-align: center; padding: 80px 20px; max-width: 600px; margin: 0 auto;">
    <div style="width: 80px; height: 80px; background: rgba(245, 158, 11, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
        <i data-lucide="x-circle" style="width: 40px; height: 40px; color: #f59e0b;"></i>
    </div>
    <h1 style="font-size: 2rem; margin-bottom: 12px;">Payment Cancelled</h1>
    <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 32px;">
        No charges were made. You can upgrade anytime from the pricing page.
    </p>
    <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
        <a href="{{ url_for('main.pricing') }}" class="btn btn-primary" style="padding: 12px 28px;">
            View Plans
        </a>
        <a href="{{ url_for('main.index') }}" class="btn btn-outline" style="padding: 12px 28px;">
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
