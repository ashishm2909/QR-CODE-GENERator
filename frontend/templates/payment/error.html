{% extends "base.html" %}

{% block title %}Payment Error - QRNation{% endblock %}

{% block content %}
<div class="payment-page" style="text-align: center; padding: 80px 20px; max-width: 600px; margin: 0 auto;">
    <div style="width: 80px; height: 80px; background: rgba(239, 68, 68, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
        <i data-lucide="alert-circle" style="width: 40px; height: 40px; color: #ef4444;"></i>
    </div>
    <h1 style="font-size: 2rem; margin-bottom: 12px;">Payment Error</h1>
    <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 32px;">
        {{ error or 'Something went wrong with your payment. Please try again.' }}
    </p>
    <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
        <a href="{{ url_for('main.pricing') }}" class="btn btn-primary" style="padding: 12px 28px;">
            Try Again
        </a>
        <a href="{{ url_for('main.contact') }}" class="btn btn-outline" style="padding: 12px 28px;">
            Contact Support
        </a>
    </div>
</div>
{% endblock %}
